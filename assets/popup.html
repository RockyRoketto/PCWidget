<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>menu</title>
<style>/*{{CSS}}*/</style>
</head>
<body class="theme-sheet tone-dark">
<div id="pop"></div>
<script>
(function () {
  var post = function (m) { window.chrome.webview.postMessage(m); };
  var pop = document.getElementById('pop');
  // Go присылает {html, cls, vars, scale}; страница сообщает размер, Go ставит окно на место.
  window.__show = function (o) {
    document.body.className = o.cls;
    Object.keys(o.vars || {}).forEach(function (k) {
      if (o.vars[k]) document.body.style.setProperty(k, o.vars[k]); else document.body.style.removeProperty(k);
    });
    pop.style.zoom = o.scale / 100;
    pop.innerHTML = o.html;
    var r = pop.getBoundingClientRect();
    post('size:' + Math.ceil(r.width) + ',' + Math.ceil(r.height));
  };
  // Меню: нажатия уходят в Go, Esc закрывает.
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cmd]');
    if (b) post('cmd:' + b.getAttribute('data-cmd'));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') post('close'); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  post('ready');
})();
</script>
</body>
</html>
