<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>tip</title>
<style>/*{{CSS}}*/</style>
</head>
<body class="theme-glass">
<div id="tip"></div>
<script>
(function () {
  var post = function (m) { window.chrome.webview.postMessage(m); };
  var tip = document.getElementById('tip');
  // Go присылает {html, cls, glass, scale}; страница сообщает размер, Go ставит окно на место.
  window.__tip = function (o) {
    document.body.className = o.cls;
    document.body.style.setProperty('--glass', o.glass / 100);
    document.body.style.setProperty('--tint', o.tint);
    tip.style.zoom = o.scale / 100;
    tip.innerHTML = o.html;
    var r = tip.getBoundingClientRect();
    post('size:' + Math.ceil(r.width) + ',' + Math.ceil(r.height));
  };
  // Меню: нажатия уходят в Go, Esc закрывает.
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cmd]');
    if (b) post('cmd:' + b.getAttribute('data-cmd'));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') post('close'); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  post('ready');
})();
</script>
</body>
</html>
